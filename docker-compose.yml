services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gacha
      POSTGRES_PASSWORD: gacha
      POSTGRES_DB: gacha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gacha"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gacha:gacha@postgres:5432/gacha
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-me-in-production
      PORT: 3001
      FRONTEND_USER_ORIGIN: http://localhost:3000
      FRONTEND_ADMIN_ORIGIN: http://localhost:3002
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: item-images
      MINIO_USE_SSL: "false"
      # Rate limiting (optional — read directly from env at module init).
      # GLOBAL_THROTTLE_LIMIT: "40"
      # GLOBAL_THROTTLE_TTL_MS: "60000"
      # GACHA_PULL_THROTTLE_LIMIT: "120"
      # GACHA_PULL_THROTTLE_TTL_MS: "60000"
      # ADMIN_FEED_RATE_LIMIT_MAX: "10"
      # ADMIN_FEED_RATE_LIMIT_DURATION_MS: "1000"
      # System config (gacha rules, security) — these live in the DB, not env
      # vars; see backend/.env.example and backend/prisma/seed.js. Only the
      # two auth token lifetimes above (JWT_ACCESS_EXPIRES_IN_SECONDS,
      # REFRESH_TOKEN_EXPIRES_IN_SECONDS) are wired as env overrides.
    ports:
      - "3001:3001"
    # Seed is an idempotent upsert (see backend/prisma/seed.js), safe to run on every boot.
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main.js"

  frontend-user:
    build:
      context: ./frontend-user
    restart: unless-stopped
    depends_on:
      - backend
    # NEXT_PUBLIC_API_URL is a browser-side value that Next.js inlines at
    # build time (frontend-user/.env.local), not a container runtime env var —
    # setting it here would silently do nothing.
    ports:
      - "3000:3000"

  frontend-admin:
    build:
      context: ./frontend-admin
    restart: unless-stopped
    depends_on:
      - backend
    # NEXT_PUBLIC_API_URL is a browser-side value that Next.js inlines at
    # build time (frontend-admin/.env.local), not a container runtime env var —
    # setting it here would silently do nothing.
    ports:
      - "3002:3002"

volumes:
  postgres_data:
  minio_data:
